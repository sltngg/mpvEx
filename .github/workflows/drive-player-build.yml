name: Drive Player MPV - build APK (arm64-v8a)

# Dijalankan manual dari tab Actions (Run workflow). Cocok untuk repo privat.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Periksa secrets
        run: |
          for v in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.gradle membaca jumlah commit via git

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build (arm64-v8a saja, unsigned)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease -PdriveOnlyArm64=true --stacktrace

      - name: Tanda tangani APK
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/standard/release
          UNSIGNED="$DIR/app-standard-arm64-v8a-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "::error::APK unsigned tidak ditemukan"; ls -la "$DIR" || true; exit 1
          fi
          # build-tools terbaru yang terpasang di runner (>= 34)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Memakai $BT"
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIGNED="$DIR/DrivePlayerMPV-arm64-v8a.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$UNSIGNED"
          "$BT/apksigner" verify "$SIGNED"
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "APK_PATH=$SIGNED" >> "$GITHUB_ENV"

      - name: Unggah APK sebagai artifact (bukan release publik)
        uses: actions/upload-artifact@v4
        with:
          name: DrivePlayerMPV-arm64-v8a
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
